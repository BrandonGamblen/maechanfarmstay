<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Farmstay MaeChan Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table tool. Parameter rail on the left, sheet area on the right with tabs for 3D, plans, quantities. */
:root{
  --bg:#e9ece8; --panel:#f6f7f4; --sheet:#ffffff; --fg:#1c2320; --muted:#5b6660; --line:#cfd5cf;
  --accent:#2f6b4f; --accent-ink:#ffffff; --warn:#a85a14; --warn-bg:#fbefe1; --vp:#dde3de;
  --pc:#38403b; --pb:#e7eae5; --pl:#8a938d; --pd:#2f6b4f; --pt:#1c2320; --pp:#c57a2a;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1b201d; --sheet:#202622; --fg:#e2e7e3; --muted:#97a29b; --line:#323b36;
  --accent:#72c095; --accent-ink:#0f1a14; --warn:#e7a35c; --warn-bg:#33261a; --vp:#1d2320;
  --pc:#d9ded9; --pb:#2a312d; --pl:#6d776f; --pd:#72c095; --pt:#e2e7e3; --pp:#e39a4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1b201d; --sheet:#202622; --fg:#e2e7e3; --muted:#97a29b; --line:#323b36;
  --accent:#72c095; --accent-ink:#0f1a14; --warn:#e7a35c; --warn-bg:#33261a; --vp:#1d2320;
  --pc:#d9ded9; --pb:#2a312d; --pl:#6d776f; --pd:#72c095; --pt:#e2e7e3; --pp:#e39a4c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
*{box-sizing:border-box}
.app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[disabled]{opacity:.5;cursor:not-allowed}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;flex:1;min-height:0}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 90px);min-width:0}
.rail details{border-bottom:1px solid var(--line)}
.rail summary{list-style:none;cursor:pointer;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.rail summary::-webkit-details-marker{display:none}
.rail summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
.rail details[open] summary::after{content:"−"}
.rows{display:grid;gap:2px;padding:0 10px 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 34px;align-items:center;gap:6px;padding:3px 4px;border-radius:4px}
.row:hover{background:var(--bg)}
.row label{font-size:12.5px;color:var(--fg);min-width:0}
.row .tag{display:inline-block;margin-left:5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 4px;vertical-align:1px}
.row input,.row select{width:100%;font-family:var(--mono);font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.row input.changed{border-color:var(--accent)}
.row .u{font-family:var(--mono);font-size:11px;color:var(--muted)}
.railfoot{padding:12px 14px;display:grid;gap:8px}
.railfoot textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--fg);padding:6px}
.railfoot .btns{display:flex;flex-wrap:wrap;gap:6px}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;font-family:var(--display);font-size:16px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.warns{display:grid;gap:6px}
.warn{background:var(--warn-bg);color:var(--fg);border-left:3px solid var(--warn);padding:7px 10px;border-radius:4px;font-size:13px}
.warn b{color:var(--warn);font-weight:600}
.pane{min-width:0}
.vpwrap{position:relative;background:var(--vp);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:min(68vh,760px);min-height:360px}
#vp{position:absolute;inset:0}
#vp canvas{display:block;width:100%;height:100%;touch-action:none}
.tool{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;border-right:1px solid var(--line);padding:6px 10px}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);cursor:pointer;user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.cutctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cutctl input[type=range]{width:160px;accent-color:var(--accent)}
.cutctl output{font-family:var(--mono);color:var(--fg);min-width:64px}
.hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--vp) 80%,transparent);padding:2px 6px;border-radius:4px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:12px}
.sheet svg{display:block;width:100%;height:auto;min-width:640px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;color:var(--muted)}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sec td{font-family:var(--display);font-weight:700;font-size:15px;padding-top:16px;color:var(--accent);border-bottom:1px solid var(--accent)}
tr.tot td{font-weight:600}
td.note{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:-1px;border:1px solid var(--pl)}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{max-height:none;order:2}
  .vpwrap{height:58vh;min-height:300px}
  .actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Farmstay MaeChan Model</h1>
      <div class="sub">Guest room, roof deck, vine lattice and earth-tube cooling · all dimensions in cm · change any value and the model rebuilds</div>
    </div>
    <div class="actions">
      <button id="btnZip" class="primary">Download model (.zip)</button>
      <button id="btnPng">Save view (.png)</button>
    </div>
  </header>

  <div class="main">
    <aside class="rail" id="rail" aria-label="Model variables"></aside>

    <section class="stage">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="3d" aria-selected="true">3D model</button>
        <button class="tab" role="tab" data-tab="ground" aria-selected="false">Ground plan</button>
        <button class="tab" role="tab" data-tab="roof" aria-selected="false">Roof plan</button>
        <button class="tab" role="tab" data-tab="qty" aria-selected="false">Quantities</button>
      </div>
      <div class="warns" id="warns"></div>

      <div class="pane" data-pane="3d">
        <div class="tool" style="margin-bottom:8px">
          <div class="seg" id="views">
            <button data-view="3d" aria-pressed="true">3D</button>
            <button data-view="top" aria-pressed="false">Top</button>
            <button data-view="south" aria-pressed="false">South (front)</button>
            <button data-view="east" aria-pressed="false">East side</button>
          </div>
          <div class="seg" id="cuts">
            <button data-cut="none" aria-pressed="true">No cut</button>
            <button data-cut="plan" aria-pressed="false">Plan cut</button>
            <button data-cut="section" aria-pressed="false">Section</button>
          </div>
          <div class="cutctl" id="cutctl" hidden><label for="cutval">Cut at</label><input type="range" id="cutval"><output id="cutout"></output></div>
        </div>
        <div class="chips" id="layers" style="margin-bottom:8px"></div>
        <div class="vpwrap"><div id="vp"></div><div class="hint">Drag to orbit · right-drag or two fingers to pan · scroll or pinch to zoom · ground is see-through; turn off Building to see the pipe under it</div></div>
      </div>

      <div class="pane" data-pane="ground" hidden><div class="sheet" id="groundPlan"></div></div>
      <div class="pane" data-pane="roof" hidden><div class="sheet" id="roofPlan"></div></div>
      <div class="pane" data-pane="qty" hidden><div class="sheet"><div class="tablewrap" id="qty"></div></div></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/lib/three.min.js"></script>
<script src="/lib/OrbitControls.js"></script>
<script src="/lib/jszip.min.js"></script>

<script id="core">
/*CORE-START*/
const GROUPS={b:"Building shell",o:"Doors & windows",r:"Roof deck & cover",s:"Site: walkways, courtyard, walls",l:"Vine lattice",c:"Earth-tube cooling",p:"Plumbing, septic & kitchen",q:"Estimating inputs"};
// [group,key,label,default,unit,assumed?]
const PDEF=[
 ["b","frontBearing","Compass bearing the front faces (180 = south)",152,"deg"],
 ["b","outerW","Outer width",487,"cm"],
 ["b","sideT","Side wall thickness",15,"cm"],
 ["b","endT","Front and back wall thickness",15,"cm"],
 ["b","partT","Partition wall thickness",15,"cm"],
 ["b","bedL","Bedroom inner length",579.1,"cm"],
 ["b","bathL","Bathroom inner length",167.7,"cm"],
 ["b","statedL","Stated total length (check value)",802.6,"cm"],
 ["b","totalH","Grade to top of roof slab",320,"cm",1],
 ["b","roofT","Roof slab thickness",15,"cm",1],
 ["b","skirtH","Foundation skirt height",30.5,"cm"],
 ["b","skirtOff","Skirt projection past wall",5,"cm",1],
 ["b","floorT","Floor slab thickness",10,"cm",1],
 ["b","footD","Footing depth below grade",60,"cm",1],
 ["b","footW","Footing width",45,"cm",1],
 ["o","winX","Front window, from left corner",75,"cm",1],
 ["o","winW","Front window width",150,"cm",1],
 ["o","winH","Front window height",120,"cm",1],
 ["o","winSill","Front window sill above floor",90,"cm",1],
 ["o","doorX","Front door, from right corner",30,"cm",1],
 ["o","doorW","Door width",90,"cm",1],
 ["o","doorH","Door height",210,"cm",1],
 ["o","pdoorX","Bathroom door, from left inner wall",40,"cm",1],
 ["o","pdoorW","Bathroom door width",75,"cm",1],
 ["o","bwinW","Bathroom vent width",60,"cm",1],
 ["o","bwinH","Bathroom vent height",40,"cm",1],
 ["o","bwinSill","Bathroom vent sill above floor",170,"cm",1],
 ["o","sideWinW","East wall window width (0 = none)",0,"cm"],
 ["o","sideWinH","East wall window height",100,"cm"],
 ["o","sideWinSill","East wall window sill",110,"cm"],
 ["r","parH","Parapet guard height",110,"cm",1],
 ["r","parT","Parapet thickness",15,"cm",1],
 ["r","coverH","Cover underside above roof deck",250,"cm",1],
 ["r","coverGap","Air gap between cover layers",30,"cm",1],
 ["r","coverOver","Cover overhang past walls",60,"cm",1],
 ["r","coverPosts","Cover posts per long side",3,"no.",1],
 ["r","tankSide","Tank corner (0 west, 1 east)",1,"",0],
 ["r","tankD","Tank diameter",110,"cm",1],
 ["r","tankH","Tank height",125,"cm",1],
 ["r","tankBase","Tank plinth height",30,"cm",1],
 ["r","stairSide","Stair side (0 west, 1 east)",1,""],
 ["r","stairW","Stair width",90,"cm",1],
 ["r","riserMax","Maximum riser",18,"cm",1],
 ["r","tread","Tread depth",25,"cm",1],
 ["r","stairStart","Stair start, from front wall",60,"cm",1],
 ["r","stairWallT","Stair outer wall thickness",15,"cm",1],
 ["r","stairWallH","Stair wall height above steps",100,"cm",1],
 ["r","storeDoorW","Storage door from bedroom, width (under landing)",90,"cm",1],
 ["r","storeDoorH","Storage door height",200,"cm",1],
 ["r","storeCabW","Low storage cabinet opening, width",150,"cm",1],
 ["r","storeCabH","Low storage cabinet opening, height",90,"cm",1],
 ["r","storeShelfH","Storage divider height (top section goes to utility)",210,"cm",1],
 ["r","utilOn","Utility closet in rear corner (1/0)",1,""],
 ["r","utilDoorW","Utility closet door width",75,"cm",1],
 ["r","utilDoorH","Utility closet door height",200,"cm",1],
 ["s","walkW","Walkway width (side without stair)",195,"cm",1],
 ["s","courtL","Courtyard length",579.1,"cm"],
 ["s","pavT","Paving thickness",10,"cm",1],
 ["s","perimH","Perimeter wall height",100,"cm",1],
 ["s","perimT","Perimeter wall thickness",15,"cm",1],
 ["s","gateWall","Gate wall (1 North, 2 East, 3 South, 4 West)",4,""],
 ["s","gateW","Gate opening width",150,"cm",1],
 ["s","gateX","Gate offset from centre of its wall",0,"cm"],
 ["s","closeBack","Close walkway ends at back (1 yes, 0 no)",1,""],
 ["l","latOff","Lattice height above cover top",5,"cm"],
 ["l","latOut","Lattice height outside building (0 = same, flat)",0,"cm"],
 ["l","latGrid","Cable spacing over building and walkways",100,"cm",1],
 ["l","latGridC","Cable spacing over courtyard (star view)",200,"cm",1],
 ["l","postSp","Perimeter post spacing",300,"cm",1],
 ["l","chimClear","Clearance kept around chimney",60,"cm"],
 ["c","tubeD","Pipe diameter",200,"mm"],
 ["c","tubeL","Total pipe length",40,"m",1],
 ["c","tubeSp","Spacing between pipe legs",80,"cm",1],
 ["c","tubeEdge","Pipe kept inside outer wall face by",50,"cm",1],
 ["c","layerGap","Vertical gap between pipe layers",80,"cm",1],
 ["c","tubeDepth","Depth to top of pipe at intake",220,"cm"],
 ["c","tubeSlope","Fall toward sump",1.5,"%"],
 ["c","intakeOut","Intake distance out from north wall",60,"cm",1],
 ["c","intakeH","Intake height above grade",150,"cm"],
 ["c","gwDepth","Groundwater depth (measure in Sept.)",400,"cm",1],
 ["c","chimIn","Solar chimney inner size",60,"cm",1],
 ["c","chimT","Chimney wall thickness",10,"cm",1],
 ["c","chimH","Chimney height above roof deck",420,"cm",1],
 ["c","chimGF","Chimney glass on front face (1/0)",1,""],
 ["c","chimGL","Chimney glass on left face (1/0)",1,""],
 ["c","chimGR","Chimney glass on right face (1/0)",1,""],
 ["c","chimGB","Chimney glass on back face (1/0)",0,""],
 ["c","panelMast","Panel mast above chimney",100,"cm"],
 ["c","panelW","Solar panel width",100,"cm",1],
 ["c","panelL","Solar panel length",170,"cm",1],
 ["c","panelTilt","Panel tilt, facing south",15,"deg"],
 ["p","sepD","Septic tank diameter",120,"cm",1],
 ["p","sepH","Septic tank height",150,"cm",1],
 ["p","sepOff","Septic tank, south of building front",250,"cm",1],
 ["p","sepTop","Septic tank top below grade",30,"cm",1],
 ["p","drainFall","Drain fall",2,"%",1],
 ["p","leachN","Number of leach trenches",2,"no.",1],
 ["p","leachL","Leach trench length",600,"cm",1],
 ["p","leachW","Leach trench width",60,"cm",1],
 ["p","leachSp","Leach trench spacing",200,"cm",1],
 ["p","leachOff","First trench, south of south wall",260,"cm",1],
 ["p","kitX","Kitchen counter start, from west parapet",30,"cm",1],
 ["p","kitL","Kitchen counter length (north parapet)",230,"cm",1],
 ["q","rebarKg","Rebar per m³ of structural concrete",90,"kg",1],
 ["q","liveLoad","Roof deck live load",3.0,"kN/m²",1]
];
function defaults(){const o={};PDEF.forEach(d=>o[d[1]]=d[3]);return o;}
const CONC={concrete:1,slab:1,paving:1};

function build(P){
 const parts=[],cables=[],warn=[],I={};
 const BOX=(layer,group,mat,x0,y0,z0,x1,y1,z1,ex)=>{
   if(x1<x0)[x0,x1]=[x1,x0]; if(y1<y0)[y0,y1]=[y1,y0]; if(z1<z0)[z0,z1]=[z1,z0];
   if(x1-x0<0.05||y1-y0<0.05||z1-z0<0.05)return;
   parts.push(Object.assign({kind:"box",layer,group,mat,x0,y0,z0,x1,y1,z1},ex||{}));};
 const CYL=(layer,group,mat,a,b,r,ex)=>parts.push(Object.assign({kind:"cyl",layer,group,mat,a,b,r},ex||{}));
 // wall along axis with rectangular openings {u,w,v,h} (absolute coordinates)
 const wallRun=(layer,group,mat,axis,u0,u1,c0,c1,y0,y1,ops)=>{
   const cl=v=>Math.max(u0,Math.min(u1,v));
   const cuts=[u0,u1];(ops||[]).forEach(o=>cuts.push(cl(o.u),cl(o.u+o.w)));
   const us=[...new Set(cuts.map(v=>Math.round(v*1000)/1000))].sort((a,b)=>a-b);
   for(let i=0;i<us.length-1;i++){const a=us[i],b=us[i+1];if(b-a<0.05)continue;const m=(a+b)/2;
     let segs=[[y0,y1]];
     (ops||[]).filter(o=>m>o.u&&m<o.u+o.w).forEach(o=>{const lo=o.v,hi=o.v+o.h;
       segs=segs.flatMap(([s,e])=>{const r=[];if(lo>s)r.push([s,Math.min(e,lo)]);if(hi<e)r.push([Math.max(s,hi),e]);return r.filter(q=>q[1]-q[0]>0.05);});});
     segs.forEach(([s,e])=>{if(axis==="x")BOX(layer,group,mat,a,s,c0,b,e,c1);else BOX(layer,group,mat,c0,s,a,c1,e,b);});}
 };
 // horizontal sheet with a rectangular hole
 const sheet=(layer,group,mat,x0,z0,x1,z1,y0,y1,h)=>{
   if(!h||h.x1<=x0||h.x0>=x1||h.z1<=z0||h.z0>=z1){BOX(layer,group,mat,x0,y0,z0,x1,y1,z1);return;}
   BOX(layer,group,mat,x0,y0,z0,x1,y1,h.z0);BOX(layer,group,mat,x0,y0,h.z1,x1,y1,z1);
   BOX(layer,group,mat,x0,y0,h.z0,h.x0,y1,h.z1);BOX(layer,group,mat,h.x1,y0,h.z0,x1,y1,h.z1);};

 const W=P.outerW,st=P.sideT,et=P.endT,pt=P.partT;
 const iW=W-2*st,L=2*et+P.bedL+pt+P.bathL;
 const sH=P.skirtH,top=P.totalH,wTop=top-P.roofT,off=P.skirtOff;
 const zP0=et+P.bedL,zP1=zP0+pt,zB0=zP1+P.bathL;
 Object.assign(I,{W,L,iW,st,et,pt,sH,top,wTop,zP0,zP1,zB0,ceil:wTop-sH});
 if(Math.abs(L-P.statedL)>0.5)warn.push(["Length does not close.",`Walls plus rooms add up to ${L.toFixed(1)} cm; your stated total is ${P.statedL} cm, a ${(P.statedL-L).toFixed(1)} cm difference. Change a wall thickness or a room length until they match.`]);

 // footings
 const h=P.footW/2,fd=P.footD;
 BOX("structure","Footings","concrete",st/2-h,-fd,et/2-h,st/2+h,0,L-et/2+h);
 BOX("structure","Footings","concrete",W-st/2-h,-fd,et/2-h,W-st/2+h,0,L-et/2+h);
 BOX("structure","Footings","concrete",st/2+h,-fd,et/2-h,W-st/2-h,0,et/2+h);
 BOX("structure","Footings","concrete",st/2+h,-fd,L-et/2-h,W-st/2-h,0,L-et/2+h);
 BOX("structure","Footings","concrete",st/2+h,-fd,(zP0+zP1)/2-h,W-st/2-h,0,(zP0+zP1)/2+h);
 // skirt

 }else{

 }
 // dimensions
 const dH=(xa,xb,yRef,yL,label)=>{o.push(`<line class="ex" x1="${xa}" y1="${yRef}" x2="${xa}" y2="${yL+(yL>yRef?12:-12)}"/><line class="ex" x1="${xb}" y1="${yRef}" x2="${xb}" y2="${yL+(yL>yRef?12:-12)}"/><line class="dm" x1="${xa}" y1="${yL}" x2="${xb}" y2="${yL}"/><line class="tk2" x1="${xa-7}" y1="${yL+7}" x2="${xa+7}" y2="${yL-7}"/><line class="tk2" x1="${xb-7}" y1="${yL+7}" x2="${xb+7}" y2="${yL-7}"/>`);
   const sm=xb-xa<70;o.push(`<text class="t d${sm?" sm":""}" x="${(xa+xb)/2}" y="${yL-8}" text-anchor="middle">${label}</text>`);};
 const dV=(za,zb,xRef,xL,label)=>{const ya=-za,yb=-zb;o.push(`<line class="ex" x1="${xRef}" y1="${ya}" x2="${xL+(xL>xRef?12:-12)}" y2="${ya}"/><line class="ex" x1="${xRef}" y1="${yb}" x2="${xL+(xL>xRef?12:-12)}" y2="${yb}"/><line class="dm" x1="${xL}" y1="${ya}" x2="${xL}" y2="${yb}"/><line class="tk2" x1="${xL-7}" y1="${ya+7}" x2="${xL+7}" y2="${ya-7}"/><line class="tk2" x1="${xL-7}" y1="${yb+7}" x2="${xL+7}" y2="${yb-7}"/>`);

 const chainH=(pts,yRef,yL)=>{for(let i=0;i<pts.length-1;i++)dH(pts[i],pts[i+1],yRef,yL,f1(pts[i+1]-pts[i]));};
 const chainV=(pts,xRef,xL)=>{for(let i=0;i<pts.length-1;i++)dV(pts[i],pts[i+1],xRef,xL,f1(pts[i+1]-pts[i]));};
 const W=I.W,L=I.L,xr=xmax;
 if(which==="ground"){

   const G=I.site.gate,gm=(G.a+G.b)/2;
   if(G.wall===3)chainH([xmin+P.perimT,G.a,G.b],-zc-P.perimT,-zc-P.perimT-45);

   if(G.wall===2)chainV([-P.courtL,G.a,G.b],xmax-I.site.tr,xmax-I.site.tr-50);
   const lab=(x,z,a,b)=>{o.push(`<text class="t r" x="${x}" y="${-z}" text-anchor="middle">${a}</text>`);if(b)o.push(`<text class="t s" x="${x}" y="${-z+30}" text-anchor="middle">${b}</text>`);};
   lab(W/2+60,I.et+P.bedL*0.42,"Bedroom",`${f1(I.iW)} × ${f1(P.bedL)}`);
   lab(W/2,I.zP1+P.bathL*0.32,"Bathroom",`${f1(I.iW)} × ${f1(P.bathL)}`);
   lab((xmin+I.plumb.qB-I.plumb.sr)/2,-P.courtL*0.55,"Courtyard",`${f1(I.site.wl+W+I.site.wr)} × ${f1(P.courtL)}`);
   const sx=(I.stair.sx0+I.stair.sx1)/2;lab(sx,I.stair.z0-45,"Stair up");
   o.push(`<line class="arr" x1="${sx}" y1="${-I.stair.z0-20}" x2="${sx}" y2="${-I.stair.zl0+20}" marker-end="url(#ah)"/>`);
   if(G.wall===3)lab(gm,zc+P.perimT+110,"Gate");
   if(G.wall===1)lab(gm,L-P.perimT-110,"Gate");
   if(G.wall===4)o.push(`<text class="t r" x="${xmin-20}" y="${-gm+10}" text-anchor="end">Gate</text>`);
   if(G.wall===2)o.push(`<text class="t r" x="${xmax+20}" y="${-gm+10}">Gate</text>`);
   if(I.store.ut){o.push(`<text class="t s" x="${sx}" y="${-(I.stair.zl1+L)/2}" text-anchor="middle">Utility</text>`);}
   if(I.store.on){const zc=(I.store.zs+I.stair.zl1)/2;o.push(`<text class="t s" x="${sx+28}" y="${-zc}" text-anchor="middle" transform="rotate(-90 ${sx+28} ${-zc})">storage under</text>`);}
   const wx=P.stairSide?-I.site.wl/2:W+I.site.wr/2;lab(wx,L*0.55,"Walkway");
 }else{
   chainH([0,W],-L,-L-110-P.coverOver);
   chainV([0,I.stair.zl0,I.stair.zl1,L],xr,xr+55);dV(0,L,xr,xr+120,f1(L));
   const C=I.chim;chainH([0,C.x0,C.x1,W],-C.z0,-C.z0+45);
   const t=I.tank;chainH([0,t.x-t.r,t.x+t.r,W],-L,-L-55-P.coverOver);
   const lab=(x,z,a,b,an)=>{an=an||"middle";o.push(`<text class="t r" x="${x}" y="${-z}" text-anchor="${an}">${a}</text>`);if(b)o.push(`<text class="t s" x="${x}" y="${-z+30}" text-anchor="${an}">${b}</text>`);};
   lab(P.tankSide?t.x+t.r:t.x-t.r,t.z-t.r-50,"Water tank",`Ø${P.tankD} · ${Math.round(t.litres).toLocaleString("en-US")} L`,P.tankSide?"end":"start");
   lab(P.tankSide?C.x1+20:C.x0-20,(C.z0+C.z1)/2,"Solar chimney",`${f1(C.x1-C.x0)} × ${f1(C.x1-C.x0)} outside`,P.tankSide?"start":"end");
   lab(W/2,L*0.35,"Roof deck",`parapet ${P.parH} high`);
   lab(P.stairSide?W-P.parT-20:P.parT+20,(I.stair.zl0+I.stair.zl1)/2,"Stair landing","parapet gap 100",P.stairSide?"end":"start");
 }
 // north arrow
 const nx=xmin-110,ny=-zmax-60;
 o.push(`<g transform="translate(${nx} ${ny}) rotate(${(180-I.bearing+360)%360})"><path class="na" d="M0 -40 L18 30 L0 18 L-18 30 Z"/><text class="t r" x="0" y="-52" text-anchor="middle">N</text></g><text class="t s" x="${nx-70}" y="${ny+70}">front faces ${I.bearing.toFixed(0)}°</text>`);
 o.push(`<text class="t ttl" x="${xmin}" y="${-zmin+215}">${which==="ground"?"Ground plan, cut at 90 cm above grade":"Roof plan, cut at 60 cm above roof deck"} · dimensions in cm</text>${which==="ground"?`<text class="t s" x="${xmin}" y="${-zmin+250}">Earth tube under the building: ${(I.tube.len/100).toFixed(1)} m in ${I.tube.layers} layer(s), intake at the back wall.</text><text class="t s" x="${xmin}" y="${-zmin+280}">Drains: solid = toilet and effluent, dashed = greywater.</text>`:""}`);
 const css=`.ct{fill:var(--pc,#38403b)}.bl{fill:var(--pb,#e7eae5);stroke:var(--pl,#8a938d);stroke-width:1.5}.gl{fill:#8fc9e8;opacity:.7}.fx{fill:none;stroke:var(--pl,#8a938d);stroke-width:2}.tk{fill:none;stroke:var(--pd,#2f6b4f);stroke-width:4}
.ex{stroke:var(--pl,#8a938d);stroke-width:1.2}.dm{stroke:var(--pd,#2f6b4f);stroke-width:1.6}.tk2{stroke:var(--pd,#2f6b4f);stroke-width:2.4}.pipe{stroke:var(--pp,#c57a2a);stroke-width:${Math.max(6,m.I.tube.D)};stroke-dasharray:28 16;opacity:.55}.pipe2{stroke:var(--pp,#c57a2a);stroke-width:6;stroke-dasharray:6 10;opacity:.9}
.sump{fill:none;stroke:var(--pp,#c57a2a);stroke-width:3;stroke-dasharray:10 8}.pb{stroke:#5a4632;stroke-width:9}.pg{stroke:#7a8f9e;stroke-width:7;stroke-dasharray:14 8}.pl2{stroke:#5a4632;stroke-width:6;stroke-dasharray:4 6}.sep{fill:none;stroke:#5a4632;stroke-width:3}.lt{fill:#b9b3a6;opacity:.6;stroke:#5a4632;stroke-width:1.5}.dash{fill:none;stroke:var(--pd,#2f6b4f);stroke-width:2.5;stroke-dasharray:18 12}.arr{stroke:var(--pt,#1c2320);stroke-width:2.5}.na{fill:var(--pt,#1c2320)}
.t{fill:var(--pt,#1c2320);font-family:'IBM Plex Sans',Arial,sans-serif}.d{font-size:21px;font-family:'IBM Plex Mono',monospace}.sm{font-size:15px}.r{font-size:30px;font-weight:600}.s{font-size:20px}.ttl{font-size:26px;font-weight:600}`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${vw} ${vh}"><style>${css}</style><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--pt,#1c2320)"/></marker></defs>${o.join("")}</svg>`;
}

<script>
const LAYERS=[["structure","Building"],["roofdeck","Roof deck, stair, tank"],["cover","Shade cover"],["lattice","Vine lattice"],["site","Walkways, courtyard, walls"],["cooling","Cooling system"],["plumbing","Plumbing & septic"],["furniture","Fixtures & person"],["ground","Ground surface"]];
const KEY="maechan-model-v7";
let P=defaults();try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)Object.assign(P,s);}catch(e){}
let model=null,layerOn={};LAYERS.forEach(([k])=>layerOn[k]=true);
const $=s=>document.querySelector(s);
const toast=msg=>{const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200);};

// ----- rail -----
function renderRail(){
 const rail=$("#rail"),D=defaults();rail.innerHTML="";
 Object.entries(GROUPS).forEach(([g,title],gi)=>{
  const det=document.createElement("details");if(gi<2)det.open=true;
  det.innerHTML=`<summary>${title}</summary><div class="rows"></div>`;const rows=det.querySelector(".rows");
  PDEF.filter(d=>d[0]===g).forEach(([,k,label,def,unit,ass])=>{
   const r=document.createElement("div");r.className="row";
   r.innerHTML=`<label for="p_${k}">${label}${ass?'<span class="tag" title="Assumed value. Confirm before building.">assumed</span>':""}</label><input id="p_${k}" type="number" step="any" inputmode="decimal" value="${P[k]}"><span class="u">${unit}</span>`;
   const inp=r.querySelector("input");inp.classList.toggle("changed",P[k]!==def);
   inp.addEventListener("input",()=>{const v=parseFloat(inp.value);if(!isFinite(v))return;P[k]=v;inp.classList.toggle("changed",v!==D[k]);schedule();});
   rows.appendChild(r);});
  rail.appendChild(det);});
 const foot=document.createElement("div");foot.className="railfoot";
 foot.innerHTML=`<div class="btns"><button id="btnReset">Reset all to defaults</button><button id="btnCopy">Copy settings</button></div>
 <label for="pasteBox" class="sub">Paste settings to load them</label><textarea id="pasteBox" placeholder='{"outerW":487, ...}'></textarea><div class="btns"><button id="btnApply">Load pasted settings</button></div>`;
 rail.appendChild(foot);
 $("#btnReset").onclick=()=>{P=defaults();save();renderRail();rebuild();toast("Reset to defaults");};
 $("#btnCopy").onclick=()=>{const s=JSON.stringify(P,null,1);navigator.clipboard?.writeText(s).then(()=>toast("Settings copied"),()=>{const b=$("#pasteBox");b.value=s;b.select();toast("Copy the selected text");});};
 $("#btnApply").onclick=()=>{try{const o=JSON.parse($("#pasteBox").value);let n=0;Object.keys(o).forEach(k=>{if(k in P&&isFinite(o[k])){P[k]=+o[k];n++;}});save();renderRail();rebuild();toast(`Loaded ${n} values`);}catch(e){toast("That text is not a valid settings block");}};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};
let tmr=null;const schedule=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{save();rebuild();},150);};

// ----- three -----
const vp=$("#vp");
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.localClippingEnabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
vp.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7d66,0.72));
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.position.set(-900,2400,1600);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-1800,right:1800,top:1800,bottom:-1800,near:100,far:8000});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;
scene.add(sun);scene.add(sun.target);
const persp=new THREE.PerspectiveCamera(38,1,10,200000),ortho=new THREE.OrthographicCamera(-1,1,1,-1,-50000,50000);
const ctlP=new THREE.OrbitControls(persp,renderer.domElement),ctlO=new THREE.OrbitControls(ortho,renderer.domElement);
ctlO.enableRotate=false;ctlO.screenSpacePanning=true;ctlO.enabled=false;
let cam=persp,view="3d";
[ctlP,ctlO].forEach(c=>c.addEventListener("change",()=>render()));
const MATS={};Object.entries(MTL).forEach(([k,c])=>{const m=new THREE.MeshStandardMaterial({color:new THREE.Color(c[0],c[1],c[2]),roughness:k==="steel"||k==="panel"?.55:.92,metalness:k==="steel"?.3:0});if(c[3]!=null){m.transparent=true;m.opacity=c[3];m.side=THREE.DoubleSide;m.depthWrite=false;}MATS[k]=m;});
const edgeMat=new THREE.LineBasicMaterial({color:0x2a2f2c,transparent:true,opacity:.5});
const cableMat=new THREE.LineBasicMaterial({color:0x2f7a32});
const groundMat=new THREE.MeshStandardMaterial({color:0x8f7a58,transparent:true,opacity:.42,depthWrite:false,side:THREE.DoubleSide});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(14000,14000),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-0.5;ground.receiveShadow=true;scene.add(ground);
const root=new THREE.Group();scene.add(root);const layerGroups={};
const allMats=()=>[...Object.values(MATS),edgeMat,cableMat,groundMat];

function geomFrom(mesh){const pos=[];mesh.f.forEach(fc=>{for(let i=1;i<fc.length-1;i++)[fc[0],fc[i],fc[i+1]].forEach(j=>pos.push(...mesh.v[j]));});const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return g;}
function updateScene(){
 root.traverse(o=>{if(o.geometry)o.geometry.dispose();});root.clear();
 LAYERS.forEach(([k])=>{if(k==="ground")return;const g=new THREE.Group();g.visible=layerOn[k];layerGroups[k]=g;root.add(g);});
 model.parts.forEach(p=>{const geo=geomFrom(partMesh(p,p.kind==="cyl"?28:0));const mesh=new THREE.Mesh(geo,MATS[p.mat]||MATS.concrete);
  const tr=MATS[p.mat]&&MATS[p.mat].transparent;mesh.castShadow=!tr;mesh.receiveShadow=true;layerGroups[p.layer].add(mesh);
  if(!tr)layerGroups[p.layer].add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,28),edgeMat));});
 const pos=[];model.cables.forEach(([a,b])=>pos.push(a[0],a[1],-a[2],b[0],b[1],-b[2]));
 const cg=new THREE.BufferGeometry();cg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));layerGroups.lattice.add(new THREE.LineSegments(cg,cableMat));
 ground.visible=layerOn.ground;applyCut();render();
}
function bounds(){const I=model.I;return {x0:I.site.xmin,x1:I.site.xmax,z0:-I.L-P.intakeOut,z1:-I.plumb.zMin,y0:0,y1:Math.max(I.lattice.Hb,I.chim.top+150)};}
function setView(v){
 view=v;document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));
 const B=bounds(),cx=(B.x0+B.x1)/2,cz=(B.z0+B.z1)/2,cy=(B.y0+B.y1)/3,R=Math.max(B.x1-B.x0,B.z1-B.z0);
 if(v==="3d"){cam=persp;ctlP.enabled=true;ctlO.enabled=false;persp.position.set(cx-0.95*R,0.75*R,cz+1.25*R);ctlP.target.set(cx,cy,cz);ctlP.update();}
 else{cam=ortho;ctlP.enabled=false;ctlO.enabled=true;ortho.zoom=1;
  if(v==="top"){ortho.up.set(0,0,-1);ortho.position.set(cx,9000,cz);ctlO.target.set(cx,0,cz);}
  if(v==="south"){ortho.up.set(0,1,0);ortho.position.set(cx,cy,cz+9000);ctlO.target.set(cx,cy,cz);}
  if(v==="east"){ortho.up.set(0,1,0);ortho.position.set(B.x1+9000,cy,cz);ctlO.target.set(cx,cy,cz);}
  ortho.lookAt(ctlO.target);fitOrtho();ctlO.update();}
 render();
}
function fitOrtho(){const B=bounds(),w=vp.clientWidth||800,h=vp.clientHeight||500,a=w/h;
 let sw,sh;if(view==="top"){sw=B.x1-B.x0;sh=B.z1-B.z0;}else if(view==="south"){sw=B.x1-B.x0;sh=B.y1+80;}else{sw=B.z1-B.z0;sh=B.y1+80;}
 sw*=1.12;sh*=1.12;if(sw/sh<a)sw=sh*a;else sh=sw/a;
 ortho.left=-sw/2;ortho.right=sw/2;ortho.top=sh/2;ortho.bottom=-sh/2;
 if(view!=="top"){ortho.top=sh*0.62;ortho.bottom=-sh*0.38;}
 ortho.updateProjectionMatrix();}
let cutMode="none";
function applyCut(){const ctl=$("#cutctl"),r=$("#cutval");let planes=[];
 if(cutMode==="none"){ctl.hidden=true;}
 else{ctl.hidden=false;const v=+r.value;
  $("#cutout").textContent=(cutMode==="plan"?"height ":"x = ")+v.toFixed(0)+" cm";
  planes=[cutMode==="plan"?new THREE.Plane(new THREE.Vector3(0,-1,0),v):new THREE.Plane(new THREE.Vector3(-1,0,0),v)];}
 allMats().forEach(m=>{m.clippingPlanes=planes;m.needsUpdate=true;});ground.material.clippingPlanes=cutMode==="section"?planes:[];render();}
function setCut(m){cutMode=m;document.querySelectorAll("#cuts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cut===m));
 const r=$("#cutval"),I=model.I;
 if(m==="plan"){r.min=-400;r.max=Math.round(model.I.lattice.Hb+50);r.step=5;r.value=120;}
 if(m==="section"){r.min=Math.round(I.site.xmin);r.max=Math.round(I.site.xmax);r.step=5;r.value=Math.round(I.W/2);}
 applyCut();}
function resize(){const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);persp.aspect=w/h;persp.updateProjectionMatrix();if(cam===ortho)fitOrtho();render();}
let raf=0;function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderer.render(scene,cam);});}
function themeBg(){const c=getComputedStyle(document.documentElement).getPropertyValue("--vp").trim()||"#dde3de";renderer.setClearColor(new THREE.Color(c));render();}

// ----- other panes -----
function renderWarns(){const w=$("#warns");w.innerHTML=model.warn.map(([a,b])=>`<div class="warn"><b>${a}</b> ${b}</div>`).join("");}
function renderQty(){const rows=takeoff(model);
 $("#qty").innerHTML=`<table><thead><tr><th>Item</th><th style="text-align:right">Quantity</th><th>Unit</th><th>Note</th></tr></thead><tbody>${rows.map(r=>r.sec?`<tr class="sec"><td colspan="4">${r.sec}</td></tr>`:`<tr class="${r.tot?"tot":""}"><td>${r.item}</td><td class="n">${r.qty}</td><td>${r.unit}</td><td class="note">${r.note}</td></tr>`).join("")}</tbody></table>
 <div class="legend" style="margin-top:12px">Quantities are computed from the model geometry. Values tagged “assumed” in the variables panel are placeholders until confirmed by you or an engineer.</div>`;}
const legend=`<div class="legend"><span><i style="background:var(--pc)"></i>cut wall</span><span><i style="background:var(--pb)"></i>below cut (slab, paving, stair)</span><span><i style="background:var(--pp);border-color:var(--pp)"></i>earth tube, upper layer</span><span><i style="border:2px dotted var(--pp);background:none"></i>lower layer, sump, intake</span><span><i style="border:2px dashed var(--pd);background:none"></i>above cut</span></div>`;
function renderPlans(){$("#groundPlan").innerHTML=planSVG(model,"ground")+legend;$("#roofPlan").innerHTML=planSVG(model,"roof")+legend;}
const northArrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,-1),new THREE.Vector3(),400,0xb03a2e,90,45);scene.add(northArrow);
function orient(){const I=model.I,t=(180-I.bearing)*Math.PI/180,n=new THREE.Vector3(Math.sin(t),0,-Math.cos(t)),e=new THREE.Vector3(Math.cos(t),0,Math.sin(t));
 const sb=240*Math.PI/180,el=55*Math.PI/180,d=e.clone().multiplyScalar(Math.sin(sb)*Math.cos(el)).add(n.clone().multiplyScalar(Math.cos(sb)*Math.cos(el))).add(new THREE.Vector3(0,Math.sin(el),0));
 const c=new THREE.Vector3(I.W/2,0,-I.L/2);sun.position.copy(c).add(d.multiplyScalar(3500));sun.target.position.copy(c);sun.target.updateMatrixWorld();
 northArrow.setDirection(n);northArrow.position.set(I.site.xmin-250,5,I.site.cl);}
function rebuild(){model=build(P);renderWarns();orient();updateScene();renderQty();renderPlans();}

// ----- UI wiring -----
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
 document.querySelectorAll(".pane").forEach(p=>p.hidden=p.dataset.pane!==t.dataset.tab);if(t.dataset.tab==="3d")requestAnimationFrame(resize);});
document.querySelectorAll("#views button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.querySelectorAll("#cuts button").forEach(b=>b.onclick=()=>setCut(b.dataset.cut));
$("#cutval").addEventListener("input",applyCut);
function renderLayers(){const box=$("#layers");box.innerHTML="";LAYERS.forEach(([k,label])=>{const l=document.createElement("label");l.className="chip";l.innerHTML=`<input type="checkbox" id="ly_${k}" ${layerOn[k]?"checked":""}>${label}`;
 l.querySelector("input").onchange=e=>{layerOn[k]=e.target.checked;if(k==="ground")ground.visible=layerOn[k];else layerGroups[k].visible=layerOn[k];render();};box.appendChild(l);});}

// standalone site: plain browser downloads
const dl={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}};
const saveErr=e=>{toast("Saving failed");};
$("#btnZip").onclick=async()=>{if(!dl)return;try{const zip=new JSZip(),on={};LAYERS.forEach(([k])=>on[k]=k==="furniture"?layerOn[k]:true);
  zip.file("model.obj",toOBJ(model,on));zip.file("model.mtl",toMTL());zip.file("parameters.json",JSON.stringify(P,null,1));
  zip.file("quantities.csv",toCSV(takeoff(model)));const plain=x=>x.replace(/var\(--[a-z]+,(#[0-9a-fA-F]+)\)/g,"$1");zip.file("ground-plan.svg",plain(planSVG(model,"ground")));zip.file("roof-plan.svg",plain(planSVG(model,"roof")));
  zip.file("README.txt","Farmstay MaeChan parametric model\n\nmodel.obj + model.mtl: 3D model in metres, Y up, X to the right facing the front, Z toward the front. Building axes, not compass: the front faces the bearing set in parameters.json (default 152°). Origin is the front-left outer corner of the guest room at finished grade. Each element is its own named group (layer_element_n). In SketchUp, import the OBJ with Y as the up axis and units set to metres.\nparameters.json: every variable used. Paste it into the page to reload this exact model.\nquantities.csv: material takeoff computed from the geometry.\nground-plan.svg, roof-plan.svg: dimensioned plans in cm.\n\nValues marked 'assumed' in the page are placeholders. Structural sizes (roof slab, rebar, posts, cover frame) need an engineer before construction.\n");
  const blob=await zip.generateAsync({type:"blob"});await dl.save({filename:"maechan-model.zip",data:blob});toast("Model saved");}catch(e){saveErr(e);}};
$("#btnPng").onclick=async()=>{if(!dl)return;renderer.render(scene,cam);renderer.domElement.toBlob(async b=>{try{await dl.save({filename:`maechan-${view}.png`,data:b});toast("Image saved");}catch(e){saveErr(e);}},"image/png");};

new ResizeObserver(resize).observe(vp);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeBg);
new MutationObserver(themeBg).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
renderRail();renderLayers();rebuild();themeBg();resize();setView("3d");
</script>
</body>
</html>
